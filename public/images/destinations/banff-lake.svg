<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="banffSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="90%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="rockies" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glacierLake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#banffSky)" />
  <!-- Distant massive snowy peaks -->
  <polygon points="150,500 350,220 550,500" fill="url(#rockies)" />
  <polygon points="450,500 680,180 920,500" fill="url(#rockies)" />
  <polygon points="800,500 1020,240 1200,500" fill="url(#rockies)" />
  <!-- Lake surface -->
  <rect x="0" y="500" width="1200" height="300" fill="url(#glacierLake)" />
  <!-- Pine trees shoreline -->
  <g fill="#064e3b">
    <polygon points="40,530 55,440 70,530" />
    <polygon points="80,530 95,430 110,530" />
    <polygon points="120,535 135,450 150,535" />
    <polygon points="170,540 185,445 200,540" />
    <polygon points="1000,535 1015,440 1030,535" />
    <polygon points="1050,530 1065,420 1080,530" />
    <polygon points="1110,540 1125,435 1140,540" />
  </g>
  <!-- Canoe silhouette -->
  <g fill="#e11d48" transform="translate(620, 620)">
    <path d="M-80,0 Q0,25 80,0 Q0,8 -80,0 Z" />
    <circle cx="10" cy="-15" r="8" fill="#0f172a" />
    <path d="M-5,-7 L25,-7 L15,10 Z" fill="#0f172a" />
    <line x1="2" y1="-8" x2="35" y2="18" stroke="#f59e0b" stroke-width="3" />
  </g>
  <text x="600" y="760" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#f0fdf4" text-anchor="middle" letter-spacing="4">BANFF · MORAINE LAKE</text>
</svg>
