<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="marrakechSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#marrakechSky)" />
  <!-- Distant Koutoubia minaret -->
  <g fill="#7c2d12" opacity="0.7">
    <rect x="750" y="240" width="70" height="260" />
    <polygon points="740,240 785,190 830,240" />
    <circle cx="785" cy="180" r="10" />
  </g>
  <!-- City walls and arches -->
  <rect x="0" y="460" width="1200" height="340" fill="url(#terracotta)" />
  <!-- Moroccan Arches -->
  <path d="M120,800 L120,560 Q220,460 320,560 L320,800 Z" fill="#291206" />
  <path d="M450,800 L450,530 Q600,410 750,530 L750,800 Z" fill="#291206" />
  <path d="M880,800 L880,560 Q980,460 1080,560 L1080,800 Z" fill="#291206" />
  <!-- Glowing lanterns hanging in central arch -->
  <g transform="translate(600, 520)">
    <line x1="0" y1="-80" x2="0" y2="0" stroke="#fcd34d" stroke-width="3" />
    <polygon points="-25,0 0,-25 25,0 15,40 -15,40" fill="#f59e0b" />
    <circle cx="0" cy="10" r="35" fill="#fef08a" opacity="0.4" />
  </g>
  <text x="600" y="770" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#fed7aa" text-anchor="middle" letter-spacing="4">MARRAKECH · MEDINA SOUK</text>
</svg>
