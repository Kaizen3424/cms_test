<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mossBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mossBg)" />
  <!-- Stepping stone -->
  <ellipse cx="400" cy="380" rx="260" ry="120" fill="#27272a" stroke="#3f3f46" stroke-width="8" />
  <ellipse cx="380" cy="360" rx="210" ry="90" fill="#3f3f46" />
  <!-- Maple leaf fallen on stone -->
  <g transform="translate(420, 340) rotate(25)" fill="#ef4444">
    <path d="M0,0 L-20,-40 L0,-30 L20,-40 Z" />
    <path d="M-10,-10 L-45,-20 L-25,-5 Z" />
    <path d="M10,-10 L45,-20 L25,-5 Z" />
    <line x1="0" y1="0" x2="0" y2="25" stroke="#991b1b" stroke-width="3" />
  </g>
  <!-- Water ripples -->
  <circle cx="280" cy="220" r="40" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.4" />
  <circle cx="280" cy="220" r="70" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.25" />
  <circle cx="280" cy="220" r="110" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.1" />
  <!-- Bamboo shoot -->
  <rect x="680" y="0" width="28" height="600" fill="#059669" />
  <rect x="730" y="0" width="22" height="600" fill="#047857" />
  <text x="400" y="550" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">KYOTO · ZEN REFLECTIONS</text>
</svg>
