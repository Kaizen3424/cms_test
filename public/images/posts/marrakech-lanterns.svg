<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#1c1917" />
  <!-- Glowing lanterns -->
  <circle cx="280" cy="240" r="160" fill="url(#lanternGlow)" />
  <circle cx="520" cy="280" r="140" fill="url(#lanternGlow)" />
  <!-- Center brass lantern -->
  <g transform="translate(400, 260)">
    <line x1="0" y1="-260" x2="0" y2="-60" stroke="#d97706" stroke-width="4" />
    <path d="M-60,-60 L60,-60 L80,40 L0,120 L-80,40 Z" fill="#b45309" stroke="#fcd34d" stroke-width="3" />
    <!-- Perforations -->
    <circle cx="0" cy="-20" r="8" fill="#fef08a" />
    <circle cx="-30" cy="0" r="6" fill="#fef08a" />
    <circle cx="30" cy="0" r="6" fill="#fef08a" />
    <circle cx="-15" cy="40" r="6" fill="#fef08a" />
    <circle cx="15" cy="40" r="6" fill="#fef08a" />
    <circle cx="0" cy="70" r="6" fill="#fef08a" />
  </g>
  <!-- Background silhouettes of spice pyramids -->
  <polygon points="60,600 160,420 260,600" fill="#dc2626" />
  <polygon points="220,600 320,440 420,600" fill="#eab308" />
  <polygon points="540,600 640,410 740,600" fill="#ea580c" />
  <text x="400" y="560" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fed7aa" text-anchor="middle" letter-spacing="3">MARRAKECH · SOUK LANTERNS</text>
</svg>
