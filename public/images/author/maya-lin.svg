<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />
  <!-- Explorer silhouette with rangefinder camera and brimmed hat -->
  <!-- Shoulders -->
  <path d="M70,400 Q200,280 330,400 Z" fill="#334155" />
  <!-- Neck -->
  <rect x="180" y="240" width="40" height="60" fill="#fcd34d" />
  <!-- Head -->
  <ellipse cx="200" cy="200" rx="60" ry="70" fill="#fcd34d" />
  <!-- Hair -->
  <path d="M140,190 Q200,110 260,190 Q240,130 160,130 Z" fill="#0f172a" />
  <!-- Traveler hat -->
  <path d="M120,150 Q200,120 280,150 L270,110 Q200,80 130,110 Z" fill="#78350f" />
  <ellipse cx="200" cy="150" rx="90" ry="16" fill="#92400e" />
  <!-- Rangefinder camera strap & camera -->
  <path d="M160,280 L240,360" stroke="#0f172a" stroke-width="6" fill="none" />
  <rect x="210" y="320" width="80" height="50" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
  <circle cx="250" cy="345" r="15" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
  <circle cx="225" cy="330" r="4" fill="#ef4444" />
</svg>
